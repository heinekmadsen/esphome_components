esphome:
  name: wavin-ahc9000-dual
  friendly_name: Wavin AHC9000 Dual

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/nic6911/esphome_components
      ref: feature/wavin-multi-ahc
      path: components
    components: [wavinahc9000v4]

logger:
  baud_rate: 0

uart:
  id: uart_wavin
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 38400
  stop_bits: 1
  parity: NONE

wavinahc9000v4:
  - id: wavin2
    uart_id: uart_wavin
    flow_control_pin:
      number: GPIO3
      allow_other_uses: true
    modbus_address: 2
    update_interval: 5s
    auto_zones: true
    auto_zone_scan_interval: 30s
    poll_channels_per_cycle: 2
    allow_mode_writes: true

  - id: wavin3
    uart_id: uart_wavin
    flow_control_pin:
      number: GPIO3
      allow_other_uses: true
    modbus_address: 3
    update_interval: 6s
    auto_zones: true
    auto_zone_scan_interval: 31s
    poll_channels_per_cycle: 2
    allow_mode_writes: true

text_sensor:
  - platform: wavinahc9000v4
    wavinahc9000v4_id: wavin2
    name: "Wavin Zone Topology 2"
    type: topology

  - platform: wavinahc9000v4
    wavinahc9000v4_id: wavin3
    name: "Wavin Zone Topology 3"
    type: topology

api:
  services:
    - service: wavin2_zone_set_target
      variables:
        zone: int
        temperature: float
      then:
        - lambda: 'id(wavin2).zone_set_target(zone, temperature);'

    - service: wavin2_zone_set_mode
      variables:
        zone: int
        turn_off: bool
      then:
        - lambda: 'id(wavin2).zone_set_hvac_mode(zone, turn_off);'

    - service: wavin2_zone_set_child_lock
      variables:
        zone: int
        enabled: bool
      then:
        - lambda: 'id(wavin2).zone_set_child_lock(zone, enabled);'

    - service: wavin2_zone_set_sync
      variables:
        enabled: bool
      then:
        - lambda: 'id(wavin2).zone_set_sync(enabled);'

    - service: wavin2_zone_set_floor_min
      variables:
        zone: int
        temperature: float
      then:
        - lambda: 'id(wavin2).zone_set_floor_min(zone, temperature);'

    - service: wavin2_zone_set_floor_max
      variables:
        zone: int
        temperature: float
      then:
        - lambda: 'id(wavin2).zone_set_floor_max(zone, temperature);'

    - service: wavin2_zone_set_floor_enabled
      variables:
        zone: int
        enabled: bool
      then:
        - lambda: 'id(wavin2).zone_set_floor_enabled(zone, enabled);'

    - service: wavin2_zone_discover
      then:
        - lambda: 'id(wavin2).publish_topology();'

    - service: wavin3_zone_set_target
      variables:
        zone: int
        temperature: float
      then:
        - lambda: 'id(wavin3).zone_set_target(zone, temperature);'

    - service: wavin3_zone_set_mode
      variables:
        zone: int
        turn_off: bool
      then:
        - lambda: 'id(wavin3).zone_set_hvac_mode(zone, turn_off);'

    - service: wavin3_zone_set_child_lock
      variables:
        zone: int
        enabled: bool
      then:
        - lambda: 'id(wavin3).zone_set_child_lock(zone, enabled);'

    - service: wavin3_zone_set_sync
      variables:
        enabled: bool
      then:
        - lambda: 'id(wavin3).zone_set_sync(enabled);'

    - service: wavin3_zone_set_floor_min
      variables:
        zone: int
        temperature: float
      then:
        - lambda: 'id(wavin3).zone_set_floor_min(zone, temperature);'

    - service: wavin3_zone_set_floor_max
      variables:
        zone: int
        temperature: float
      then:
        - lambda: 'id(wavin3).zone_set_floor_max(zone, temperature);'

    - service: wavin3_zone_set_floor_enabled
      variables:
        zone: int
        enabled: bool
      then:
        - lambda: 'id(wavin3).zone_set_floor_enabled(zone, enabled);'

    - service: wavin3_zone_discover
      then:
        - lambda: 'id(wavin3).publish_topology();'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wavin Dual Fallback Hotspot"
    password: ""

captive_portal:

ota:
  - platform: esphome
